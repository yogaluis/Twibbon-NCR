<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selfie Twibbon</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
  .card{background:#111827;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.35);padding:12px;max-width:520px;width:100%}
  video,canvas{width:100%;border-radius:12px;background:#000}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{border:0;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer}
  .primary{background:#22c55e;color:#052e16}
  .danger{background:#ef4444;color:#fff}
  .ghost{background:#1f2937;color:#e5e7eb}
</style>
</head>
<body>
  <h2>Selfie Twibbon</h2>
  <div class="card">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div class="row">
      <button id="start" class="ghost">Buka Kamera</button>
      <button id="snap" class="primary" disabled>Selfie</button>
      <button id="download" class="danger" disabled>Download</button>
    </div>
  </div><script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const snapBtn = document.getElementById('snap');
const downloadBtn = document.getElementById('download');

let stream = null;
const frame = new Image();
frame.src = 'twibbon.png'; // upload file twibbon.png di repo yang sama

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user'}, audio:false });
  video.srcObject = stream;
  snapBtn.disabled=false;
}
startBtn.onclick=startCamera;

snapBtn.onclick=()=>{
  const size = Math.min(video.videoWidth, video.videoHeight);
  canvas.width=size; canvas.height=size;

  // crop tengah (persegi) + mirror
  ctx.save();
  ctx.translate(size,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,(video.videoWidth-size)/2,(video.videoHeight-size)/2,size,size,0,0,size,size);
  ctx.restore();

  // tempel twibbon
  frame.onload=()=>{ ctx.drawImage(frame,0,0,size,size); };
  if(frame.complete) ctx.drawImage(frame,0,0,size,size);

  video.style.display='none';
  canvas.style.display='block';
  downloadBtn.disabled=false;
}

downloadBtn.onclick=()=>{
  const a=document.createElement('a');
  a.download='hasil-twibbon.jpg';
  a.href=canvas.toDataURL('image/jpeg',0.95);
  a.click();
}
</script></body>
</html>
